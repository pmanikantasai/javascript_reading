<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> hii manikantasai </h1>
    <button id="start">start</button>
    <button id="stop">stop</button>
</body>
<script>

    // setTimeout(() => {
    //     console.log("3 sec"); 
    // },1000);
    // const man = function () {
    //     console.log('mani')
    // }
    // setTimeout(man,3000)
    let changed;

    const change = function(){
        document.querySelector('h1').innerHTML = 'hello man !'
        console.log('hi');
    }

    document.querySelector('#start').addEventListener('click', function(){
        changed = setTimeout(change, 4000);
    });

    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(changed)
        console.log("stopped");
        
    });

</script>
</html>
